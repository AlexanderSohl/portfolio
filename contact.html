<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Alexander Sohl about projects, opportunities, or games.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Contact | Alexander Sohl</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"><span class="scroll-progress__fill"></span></div>
  <header class="site-header">
    <a class="site-name" href="index.html">Alexander Sohl</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation menu">
      <span class="menu-toggle__line"></span>
      <span class="menu-toggle__line"></span>
      <span class="menu-toggle__line"></span>
    </button>
    <nav class="site-nav" id="primary-navigation" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-main contact-main">
    <h1>Contact Me</h1>
    <p class="contact-intro">Want to talk about a project, an opportunity, or just games? Reach out!</p>

    <section class="content-section contact-details" aria-labelledby="contact-details-heading">
      <h2 id="contact-details-heading">Get in touch</h2>
      <p>Email: <a id="contact-email" href="mailto:aws36@njit.edu">aws36@njit.edu</a></p>
      <p>GitHub: <a href="https://github.com/AlexanderSohl">https://github.com/AlexanderSohl</a></p>
    </section>

    <section class="content-section contact-form-section" aria-labelledby="contact-form-heading">
      <h2 id="contact-form-heading">Send a message</h2>
      <form id="contact-form" novalidate>
        <div class="form-field">
          <label for="contact-name">Name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
          <p class="field-error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="form-field">
          <label for="contact-sender-email">Email</label>
          <input id="contact-sender-email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="form-field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" required aria-describedby="message-error"></textarea>
          <p class="field-error" id="message-error" aria-live="polite"></p>
        </div>

        <button class="submit-button" type="submit">Open email app</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="current-year">2026</span> Alexander Sohl</p>
  </footer>
</body>
</html>
